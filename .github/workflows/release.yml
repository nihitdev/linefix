name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ./scripts/build-release.sh "$version"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "linefix ${{ github.ref_name }}"
